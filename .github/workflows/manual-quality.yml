name: Manual Canary Quality Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode
        required: true
        default: static
        type: choice
        options: [static, build]

permissions:
  contents: read

concurrency:
  group: manual-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: ${{ inputs.mode == 'static' }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Establish bounded job deadline
        shell: bash
        run: |
          set -euo pipefail
          deadline_epoch_seconds="$(($(date +%s) + 270))"
          echo "QC_STATIC_JOB_DEADLINE_EPOCH_SECONDS=${deadline_epoch_seconds}" >> "${GITHUB_ENV}"

      - &checkout_canary
        name: Check out canary revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - &checkout_engine
        name: Check out pinned quality engine
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: MArtem/AIZenflowQualityControl
          ref: 2757d4ad9626275d3cc4be4f8815b64e72c625c9
          path: .quality-engine
          fetch-depth: 1
          persist-credentials: false

      - &validate_contracts
        name: Validate canary contracts
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint QualityControlCanary.xcodeproj/project.pbxproj
          xmllint --noout QualityControlCanary.xcodeproj/xcshareddata/xcschemes/QualityControlCanary.xcscheme

      - &run_deterministic
        name: Run catalog-backed deterministic checks
        shell: bash
        env:
          QC_SECRETS_REPORT_PATH: ${{ runner.temp }}/canary-secrets-report.json
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.SECRETS.TRACKED \
            > "${QC_SECRETS_REPORT_PATH}"
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["QC_SECRETS_REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Catalog-backed tracked-secret check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.SECRETS.TRACKED":
              raise SystemExit("Unexpected deterministic check ID")
          PY

      - &run_todo_owner
        name: Run TODO ownership check
        shell: bash
        env:
          QC_TODO_REPORT_PATH: ${{ runner.temp }}/canary-todo-report.json
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.TODO.OWNER \
            > "${QC_TODO_REPORT_PATH}"
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["QC_TODO_REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("TODO ownership check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.TODO.OWNER":
              raise SystemExit("Unexpected TODO check ID")
          PY

      - &run_generated_ownership
        name: Run generated ownership check
        shell: bash
        env:
          QC_GENERATED_OWNERSHIP_REPORT_PATH: ${{ runner.temp }}/canary-generated-ownership-report.json
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.GENERATED.OWNERSHIP \
            > "${QC_GENERATED_OWNERSHIP_REPORT_PATH}"
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["QC_GENERATED_OWNERSHIP_REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Generated ownership check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.GENERATED.OWNERSHIP":
              raise SystemExit("Unexpected generated ownership check ID")
          PY

      - &run_dependency_lock_drift
        name: Run dependency lock drift check
        shell: bash
        env:
          QC_DEPENDENCY_LOCK_DRIFT_REPORT_PATH: ${{ runner.temp }}/canary-dependency-lock-drift-report.json
        run: |
          set -euo pipefail
          python3 .quality-engine/adapters/deterministic_checks.py \
            --repository-root "${GITHUB_WORKSPACE}" \
            --catalog "${GITHUB_WORKSPACE}/.quality-engine/policies/check-catalog.json" \
            --check QC.DEPENDENCY.LOCK_DRIFT \
            > "${QC_DEPENDENCY_LOCK_DRIFT_REPORT_PATH}"
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["QC_DEPENDENCY_LOCK_DRIFT_REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Dependency lock drift check did not report PASS")
          if report.get("checks", [{}])[0].get("id") != "QC.DEPENDENCY.LOCK_DRIFT":
              raise SystemExit("Unexpected dependency lock drift check ID")
          PY

      - &run_static
        name: Run pinned policy-driven static check
        shell: bash
        env:
          QC_PROFILE_PATH: ${{ runner.temp }}/canary-profile.json
          QC_REPORT_PATH: ${{ runner.temp }}/canary-report.json
          QC_SANDBOX_ROOT: ${{ runner.temp }}/canary-sandbox
        run: |
          set -euo pipefail
          mkdir -p "${QC_SANDBOX_ROOT}/cache"
          python3 - <<'PY'
          import json
          import os

          profile = {
              "schemaVersion": 1,
              "project": {"kind": "xcodeproj", "path": "QualityControlCanary.xcodeproj"},
              "scheme": "QualityControlCanary",
              "sourcePaths": ["Sources"],
              "mode": "controlled",
              "permissions": {
                  "testCreation": "deny",
                  "testModification": "deny",
                  "localTestExecution": "deny",
                  "githubExecution": "manual",
                  "uiTests": "deny",
                  "simulatorOrDevice": "deny",
                  "performanceOrInstruments": "deny",
              },
              "sandbox": {
                  "root": os.environ["QC_SANDBOX_ROOT"],
                  "cache": os.path.join(os.environ["QC_SANDBOX_ROOT"], "cache"),
              },
          }
          with open(os.environ["QC_PROFILE_PATH"], "w", encoding="utf-8") as output:
              json.dump(profile, output, sort_keys=True)
          PY

          swift run \
            --package-path "${GITHUB_WORKSPACE}/.quality-engine" \
            --scratch-path "${RUNNER_TEMP}/quality-engine-scratch" \
            -Xswiftc -warnings-as-errors \
            quality static \
            --profile "${QC_PROFILE_PATH}" \
            --policy "${GITHUB_WORKSPACE}/.quality-engine/policies/static-policy.json" \
            --repository-root "${GITHUB_WORKSPACE}" \
            > "${QC_REPORT_PATH}"

          python3 - <<'PY'
          import json
          import os

          with open(os.environ["QC_REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Canary static check did not report PASS")
          PY

      - name: Record static result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Canary Quality Check"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Engine SHA: \`2757d4ad9626275d3cc4be4f8815b64e72c625c9\`"
            echo "- Mode: \`static\`"
            echo "- Result: \`PASS\`"
            echo "- Tests, Xcode build, signing, Simulator/device work, and paid services: not run"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    if: ${{ inputs.mode == 'build' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - *checkout_canary
      - *checkout_engine
      - *validate_contracts
      - *run_deterministic
      - *run_todo_owner
      - *run_generated_ownership
      - *run_dependency_lock_drift
      - *run_static

      - name: Build authenticated synthetic Xcode evidence
        shell: bash
        env:
          QC_BUILD_REPORT_PATH: ${{ runner.temp }}/canary-build-evidence.json
          QC_ENGINE_SCRATCH: ${{ runner.temp }}/quality-engine-scratch
        run: |
          set -euo pipefail
          mkdir -p .quality-control/runtime/cache
          swift build \
            --package-path "${GITHUB_WORKSPACE}/.quality-engine" \
            --scratch-path "${QC_ENGINE_SCRATCH}" \
            -Xswiftc -warnings-as-errors \
            --product quality

          engine_bin_directory="$(swift build \
            --package-path "${GITHUB_WORKSPACE}/.quality-engine" \
            --scratch-path "${QC_ENGINE_SCRATCH}" \
            --show-bin-path)"
          engine_binary="${engine_bin_directory}/quality"
          engine_cdhash="$(codesign -d --verbose=4 "${engine_binary}" 2>&1 \
            | sed -n 's/^CDHash=//p' \
            | head -n 1)"
          if [[ ! "${engine_cdhash}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pinned engine binary has no usable CodeDirectory hash" >&2
            exit 1
          fi

          "${engine_binary}" build-evidence \
            --profile "${GITHUB_WORKSPACE}/.quality-control/profile.json" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --engine-repository-root "${GITHUB_WORKSPACE}/.quality-engine" \
            --source-repository "MArtem/AIZenflowQualityControlCanary" \
            --expected-source-revision "${GITHUB_SHA}" \
            --expected-engine-revision "2757d4ad9626275d3cc4be4f8815b64e72c625c9" \
            --expected-engine-cdhash "${engine_cdhash}" \
            --scheme "QualityControlCanary" \
            --configuration "Debug" \
            --destination "platform=macOS" \
            --execution-context "github" \
            > "${QC_BUILD_REPORT_PATH}"

          python3 - <<'PY'
          import json
          import os

          with open(os.environ["QC_BUILD_REPORT_PATH"], encoding="utf-8") as source:
              report = json.load(source)
          if report.get("status") != "PASS":
              raise SystemExit("Canary build evidence did not report PASS")
          if report.get("evidence", {}).get("claimedVerdict") != "READY":
              raise SystemExit("Canary build evidence did not verify READY")
          if report.get("verification", {}).get("issues") != []:
              raise SystemExit("Canary build evidence contains verification issues")
          PY

      - name: Record build result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Canary Quality Check"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Engine SHA: \`2757d4ad9626275d3cc4be4f8815b64e72c625c9\`"
            echo "- Mode: \`build\`"
            echo "- Static result: \`PASS\`"
            echo "- Authenticated Xcode build evidence: \`PASS / READY\`"
            echo "- Tests, signing, Simulator/device work, and paid services: not run"
          } >> "${GITHUB_STEP_SUMMARY}"
